# Pages CMS configuration — https://pagescms.org
#
# Femi edits content here without touching code: sign in at pagescms.org
# with GitHub, open iFemora/personal-site, and this file defines what's
# editable. Every save is a git commit to main, so Vercel redeploys and
# the repo stays the single source of truth (and every edit is revertable).
#
media:
  input: public
  output: /

content:
  - name: essays
    label: Essays
    type: collection
    path: content/writing
    format: yaml-frontmatter
    extension: mdx
    filename: "{fields.title}.mdx"
    view:
      fields: [title, date]
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        type: string
        required: true
      - name: date
        label: Date (YYYY-MM-DD)
        type: string
        required: true
      - name: description
        label: One-sentence description
        type: text
        required: true
      - name: homepageHidden
        label: Hide from homepage teasers
        type: boolean
      - name: body
        label: Essay
        type: rich-text
        required: true

  - name: writing-external
    label: Writing — external links
    type: file
    path: content/writing/external.json
    format: json
    list: true
    fields:
      - name: href
        label: URL
        type: string
        required: true
      - name: source
        label: Source (e.g. Substack)
        type: string
        required: true
      - name: title
        type: string
        required: true
      - name: date
        label: Date (YYYY-MM-DD)
        type: string
        required: true
      - name: description
        label: One-sentence description
        type: text
        required: true
      - name: image
        label: Hero image (remote URL)
        type: object
        fields:
          - name: src
            label: Image URL
            type: string
          - name: alt
            type: string

  - name: field-notes
    label: Field notes
    type: file
    path: content/field-notes.json
    format: json
    list: true
    fields:
      - name: id
        label: ID (YYYY-MM-DD-HHMM-slug)
        type: string
        required: true
      - name: date
        label: Date (YYYY-MM-DD)
        type: string
        required: true
      - name: title
        label: Title
        type: string
      - name: body
        label: Note (double newline = new paragraph)
        type: text
      - name: audio
        label: Audio
        type: object
        fields:
          - name: src
            label: Audio file (under /field-notes/audio/)
            type: string
          - name: title
            label: Title
            type: string

  - name: desk
    label: From the desk
    type: file
    path: content/desk.json
    format: json
    fields:
      - name: updated
        label: Updated (e.g. "July 2026")
        type: string
        required: true
      - name: items
        label: Desk items
        type: object
        list: true
        fields:
          - name: label
            label: Eyebrow (e.g. "Circling")
            type: string
            required: true
          - name: title
            type: string
            required: true
          - name: body
            type: text
            required: true
          - name: href
            label: Link (optional)
            type: string

  - name: gallery
    label: Gallery
    type: file
    path: content/gallery.json
    format: json
    list: true
    fields:
      - name: id
        type: string
        required: true
      - name: src
        label: Image
        type: image
        required: true
      - name: alt
        label: Alt text (describe the image)
        type: string
        required: true
      - name: caption
        type: string
      - name: location
        type: string
      - name: date
        label: Date (freeform, e.g. "2025")
        type: string
      - name: width
        label: Width (px)
        type: number
        required: true
      - name: height
        label: Height (px)
        type: number
        required: true
      - name: kind
        label: Section
        type: select
        options:
          values:
            - value: photo
              label: Contact sheet (photo)
            - value: art
              label: Made (art)
            - value: book
              label: Shelf (book)
      - name: href
        label: Link (optional, shown on caption)
        type: string
      - name: note
        label: Note / author line
        type: string
      - name: status
        label: Reading status (books only)
        type: select
        options:
          values:
            - reading
            - queued
            - finished
      - name: category
        label: Shelf (books only)
        type: select
        options:
          values:
            - faith
            - product
            - others
      - name: verdict
        label: One-line verdict (books only)
        type: string

  - name: studio
    label: Studio (film + creative direction)
    type: file
    path: content/studio.json
    format: json
    fields:
      - name: tagline
        type: string
        required: true
      - name: intro
        label: Intro paragraphs
        type: string
        list: true
      - name: pieces
        type: object
        list: true
        fields:
          - name: id
            type: string
            required: true
          - name: kind
            label: Eyebrow (e.g. Documentary, Addict Creative)
            type: string
            required: true
          - name: title
            type: string
            required: true
          - name: subtitle
            label: Line under the title (e.g. Promo video)
            type: string
          - name: meta
            label: Meta lines (year, runtime, place)
            type: string
            list: true
          - name: role
            type: string
            required: true
          - name: body
            type: text
            required: true
          - name: caption
            label: One line on the craft (under the player)
            type: string
          - name: credits
            label: Credits line
            type: string
          - name: video
            type: object
            fields:
              - name: provider
                type: select
                options:
                  values: [youtube, vimeo]
              - name: id
                label: Video id
                type: string
              - name: duration
                label: Runtime shown on the play button (e.g. 1:08)
                type: string
          - name: poster
            type: object
            fields:
              - name: src
                label: Poster (under /studio/)
                type: image
              - name: alt
                type: string
              - name: width
                type: number
              - name: height
                type: number
          - name: link
            type: object
            fields:
              - name: href
                label: URL
                type: string
              - name: label
                type: string

  - name: gallery-series
    label: Gallery — series
    type: file
    path: content/gallery-series.json
    format: json
    list: true
    fields:
      - name: slug
        label: URL slug (/gallery/<slug>)
        type: string
        required: true
      - name: title
        type: string
        required: true
      - name: tagline
        label: Tagline (one line under the title)
        type: string
        required: true
      - name: intro
        label: Intro sentence
        type: text
        required: true
      - name: location
        label: Location (default for every frame)
        type: string
        required: true
      - name: date
        label: Date (freeform, e.g. "2026")
        type: string
        required: true
      - name: cover
        label: Strip on /gallery (frame ids, in order)
        type: string
        list: true
      - name: hero
        label: Opening frame
        type: object
        fields:
          - name: id
            type: string
            required: true
          - name: src
            label: Image
            type: image
            required: true
          - name: alt
            label: Alt text (describe the image)
            type: string
            required: true
          - name: width
            type: number
            required: true
          - name: height
            type: number
            required: true
          - name: caption
            type: string
          - name: location
            label: Location (overrides the series)
            type: string
          - name: date
            label: Date (overrides the series)
            type: string
      - name: chapters
        type: object
        list: true
        fields:
          - name: title
            type: string
            required: true
          - name: note
            label: Line under the chapter title
            type: string
          - name: frames
            type: object
            list: true
            fields:
              - name: id
                type: string
                required: true
              - name: src
                label: Image
                type: image
                required: true
              - name: alt
                label: Alt text (describe the image)
                type: string
                required: true
              - name: width
                type: number
                required: true
              - name: height
                type: number
                required: true
              - name: caption
                type: string
              - name: location
                label: Location (overrides the series)
                type: string
              - name: date
                label: Date (overrides the series)
                type: string
              - name: group
                label: Row group (frames in a row share a letter)
                type: string

  - name: wall-of-love
    label: Wall of Love
    type: file
    path: content/wall-of-love.json
    format: json
    list: true
    fields:
      - name: id
        label: ID (YYYY-MM-DD-name)
        type: string
        required: true
      - name: name
        type: string
        required: true
      - name: role
        label: What they do
        type: string
      - name: company
        label: Where they work
        type: string
      - name: how
        label: How we know each other
        type: string
      - name: date
        label: Date (YYYY-MM-DD)
        type: string
      - name: kinds
        label: Why they love me (pick every one that fits)
        type: select
        list: true
        options:
          values:
            - value: work
              label: The work
            - value: character
              label: The character
            - value: love
              label: Just love
      - name: quote
        label: Testimonial (double newline = new paragraph)
        type: text
        required: true
      - name: highlights
        label: Highlights (exact phrases from the quote)
        type: string
        list: true
      - name: image
        type: object
        fields:
          - name: src
            label: Photo (under /wall-of-love/)
            type: image
          - name: alt
            type: string
          - name: width
            type: number
          - name: height
            type: number
          - name: position
            label: Face position (CSS object-position, e.g. "50% 28%")
            type: string
          - name: zoom
            label: Face zoom (e.g. 2.4, for full-body shots)
            type: number
      - name: featured
        label: Feature on /work testimonials
        type: boolean

  - name: tennis
    label: Tennis log
    type: file
    path: content/tennis.json
    format: json
    list: true
    fields:
      - name: id
        type: string
        required: true
      - name: date
        label: Date (YYYY-MM-DD)
        type: string
        required: true
      - name: title
        type: string
      - name: body
        label: Entry (double newline = new paragraph)
        type: text
      - name: image
        type: object
        fields:
          - name: src
            label: Image (under /tennis/)
            type: image
          - name: alt
            type: string
          - name: caption
            type: string
          - name: width
            type: number
          - name: height
            type: number
      - name: video
        type: object
        fields:
          - name: src
            label: Video file (under /tennis/)
            type: string
          - name: poster
            label: Poster image
            type: string
          - name: caption
            type: string

  - name: about-timeline
    label: About timeline
    type: file
    path: content/about-timeline.json
    format: json
    list: true
    fields:
      - name: id
        type: string
        required: true
      - name: year
        label: Year ("2015", or "Now" — non-numeric sorts last)
        type: string
        required: true
      - name: title
        type: string
        required: true
      - name: caption
        type: text
      - name: image
        type: object
        fields:
          - name: src
            label: Photo (under /about/)
            type: image
          - name: alt
            type: string
